# version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - shared_network
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app  # Keep source code mount
      - /app/node_modules # This is an anonymous volume to prevent mounting local node_modules
      - /app/.next # This is an anonymous volume to prevent mounting local .next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "npm", "run", "lint", "--", "--quiet"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

  backend:
    build: ./backend
    networks:
      - shared_network
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      bowlsman-postgres:
        condition: service_healthy

  bowlsman-postgres:
    image: postgres:15-alpine
    networks:
      - shared_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5442:5432"
    volumes:
      - ./pg_backup:/app/pg_backup
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: '256mb'
    command: 
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"

volumes:
  postgres_data:
    driver: local

networks:
  shared_network:
    external: true